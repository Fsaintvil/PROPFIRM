  max_positions: 12             # 🔧 ×½: 24→12 (réduction post-audit, seuls ~6 symboles vraiment actifs)
  max_positions_per_symbol: 6   # 🔧 conservé
  max_trades_per_day: 30        # ↓ 45→30 (réduction post-audit, focus qualité)
  max_signals_per_cycle: 10     # ↑ 8→10 (12 symboles)
  max_orders_per_minute: 8      # ↑ 6→8 (proportionnel)
  lot_size: 0.05                # lot de démarrage (×5 Juillet 2026)
  min_trade_interval_sec: 120   # 2 min minimum entre trades par symbole
  batch_interval_sec: 5         # 5s
  trading_start_hour: 0
  trading_end_hour: 24          # 24/7 — sans arret
  danger_hours: [4, 7, 21]  # 🔧 OPTIMIZER 9 Juillet 2026: ↓ 6h→3h — seules 04h(19%), 07h(22%), 21h(0%) gardées. 01h,17h,23h débloquées pour +3h trading/jour
  history_lookback_days: 7

# ── Signal ───────────────────────────────────────────────────────────────
signal:
  min_score: 0.80               # 🔴 URGENT 17 Juil 2026: ↑ 0.75→0.80 — filtre plus strict (WR challenge 42.6%)
  daily_profit_limit_pct: 0.008  # 0.8% profit/jour max (FTMO consistency)

# ── Risque FTMO ─────────────────────────────────────────────────────────
risk:
  # --- Règles FTMO obligatoires ---
  max_daily_loss_pct: 0.02       # 2% daily loss max (règle FTMO)
  max_dd_pct: 0.10               # 10% DD max (règle FTMO)
  profit_target_pct: 0.10        # 10% profit target ($20K sur 200K)
  consistency_max_pct: 0.30      # 30% max un jour / total profit
  min_trading_days: 10           # 10 jours minimum FTMO
  max_trading_days: 0            # pas de limite max

  # --- Risque par trade (ultra-conservateur 2 Juillet 2026) ---
  per_trade_pct: 0.004           # 🔴 URGENT 9 Juil 2026: ↓ 0.008→0.004 (×½) — WR 47%, risque trop élevé
  short_mult: 1.0                # même risque long/short
  max_risk_amount: 2000.0        # 🚀 PHASE 2: $2,000 max (était $400) — suit le risk_per_trade

  # --- Qualité (ultra-conservateur 2 Juillet 2026) ---
  min_rr_ratio: 1.8              # 🔧 FIX #5: ↑ 1.5→1.8 — meilleure qualité de trades
  atr_multiplier: 1.5            # multiplicateur ATR pour SL

  # --- Cooldown (ultra-conservateur 2 Juillet 2026) ---
  cooldown_minutes: 30          # 🔧 FIX #5: 30min après perte (était 15)
  auto_pause_losses: 3           # 🔧 FIX #5: 3 pertes → pause (était 5)

  # --- Volatilité ---
  max_spread_points: 120         # spread max global (overridden par symbole)

  # --- Circuit breaker (ultra-conservateur 2 Juillet 2026) ---
  circuit_breaker_dd_pct: 0.06   # 🔧 FIX #5: 6% DD → arrêt d'urgence (était 8%)

  # --- Volume max global ---
  global_max_lot: 0.01           # 🔴 FIX 17 Juil 2026: plafond absolu — évite les pertes $500+ (était 0.02)

