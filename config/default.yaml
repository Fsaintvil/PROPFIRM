# ============================================================================
# CONFIGURATION PAR DÉFAUT — FTMO 200K Challenge (1er Juillet 2026)
#
# ⚠️ ATTENTION — DUAL SOURCE OF TRUTH ⚠️
# Ce fichier combine 2 types de paramètres :
#   1) PARAMÈTRES DE SIGNAL (momentum_period, thresholds SL/TP, ADX slope, cmf_threshold)
#      → La VRAIE source est strategy.py:SYMBOL_CONFIG. Un changement ici n'affecte PAS les signaux.
#      → Pour modifier un paramètre de signal, changer strategy.py.
#   2) PARAMÈTRES DE RISQUE/LOT/CONFIG (max_lot, min_lot, risk_mult, max_spread_points, etc.)
#      → CEUX-CI SONT LUIS depuis ce YAML par config_simple.py.
#      → Un changement ici AFFECTE le comportement du robot.
#
# 8 actifs focus : USOIL.cash, EURGBP, US30.cash, SOLUSD, EURUSD, USDJPY, BTCUSD, XAUUSD
# Sélectionnés par l'analyse — top performers challenge + backtest + diversification
# Stratégie MOM20x3 pure, lots progressifs WR-based, risque calibré pour gagner
# ============================================================================
# Chaque paramètre est justifié par:
#   - Backtest 12+ ans (158,964 trades, H1/H4/D1)
#   - Backtest production avec coûts (spread, slippage, commission)
#   - Walk-forward p-value, Monte Carlo 1000 simulations
#   - Règles FTMO (DD 10%, daily loss 2%, consistency 30%)
#   - Caractéristiques de volatilité propres à chaque actif
# ============================================================================
---
robot:
  magic: 999001
  cycle_seconds: 15
  version: "4.1.0"

# ── Trading ──────────────────────────────────────────────────────────────
trading:
  symbols:
    # ═══════════════════════════════════════════════════════════════════════
    # CONFIG PIC — 23 Juin 2026 (commit 4011b396b) — restauré 04 Aout 2026
    # ═══════════════════════════════════════════════════════════════════════
    # Retour au niveau historique le plus performant (7 symboles).
    # BTCUSD présent mais DÉSACTIVÉ (risk_mult=0.0) comme au pic.
    # ⚠️ Décision utilisateur: "Config pic COMPLÈTE + dégel total".
    #    Dépassement volontaire des vetos risk-compliance.
    - XAUUSD
    - BTCUSD
    - EURUSD
    - USDJPY
    - GBPUSD
    - AUDUSD
    - USDCAD

  # ⚖️ CONFIG PIC 23 Juin 2026 (4011b396b): max_positions 30, 200 trades/jour
  #   Restauré 04 Aout 2026 — retour au niveau le plus performant.
  #   Dépassement volontaire des vetos risk-compliance (plafond 6, VETO >8).
  max_positions: 30              # ↑ 20→30 (23 Juin) : 7 symboles × 3-4 positions
  max_positions_per_symbol: 3    # ↑ 2→3 (23 Juin) : jusqu'à 3 positions par symbole
  max_trades_per_day: 200        # ↑ 120→200 (23 Juin) : 7 symboles × ~28 trades/jour
  max_signals_per_cycle: 10     # marge pour signaux simultanés
  max_orders_per_minute: 6      # 1 trade/min/symbole + marge
  lot_size: 0.05                # lot par défaut (overridden par symbol_limits)
  global_max_lot: 0.50          # ⚖️ PIC 23 Juin: le clamp global_max_lot n'existait pas.
                                #    Levé à 0.50 pour ne pas brider les lots du pic (0.10-0.20).
  min_trade_interval_sec: 300   # 5 min minimum entre trades par symbole
  batch_interval_sec: 1         # 1s = signaux chaque cycle (15s), pas de restriction batch
  trading_start_hour: 0
  trading_end_hour: 24          # 24/7 — sans arrêt
  danger_hours: [12]            # 12:00 UTC = trou noir historique (0% WR documenté)
  history_lookback_days: 3

# ── Signal ───────────────────────────────────────────────────────────────
signal:
  min_score: 0.60               # CONFIG PIC 23 Juin: 0.60 (signaux MOM20x3 + pénalités volume)
  daily_profit_limit_pct: 0.008  # 0.8% profit/jour max (FTMO consistency)

# ── Risque FTMO ─────────────────────────────────────────────────────────
risk:
  # --- Règles FTMO obligatoires ---
  max_daily_loss_pct: 0.02       # 2% daily loss max (règle FTMO)
  max_dd_pct: 0.10               # 10% DD max (règle FTMO)
  profit_target_pct: 0.10        # 10% profit target ($20K sur 200K)
  consistency_max_pct: 0.30      # 30% max un jour / total profit
  min_trading_days: 10           # 10 jours minimum FTMO
  max_trading_days: 0            # pas de limite max

  # --- Risque par trade (CONFIG PIC — 23 Juin 2026) ---
  # production.yaml override: per_trade_pct 0.006, max_risk_amount 1200, cooldown 3, auto_pause 10
  per_trade_pct: 0.004           # ↓ 0.5%→0.4% (22 Juin, Supreme Council) : 5 pertes = 2% daily loss
  short_mult: 1.0                # même risque long/short
  max_risk_amount: 800.0         # $800 max risque par trade (production override → $1,200)

  # --- Qualité ---
  min_rr_ratio: 2.0              # conservé (TP 6.0/SL 1.5 = RR 4.0 naturel)
  atr_multiplier: 1.5            # multiplicateur ATR pour SL

  # --- Cooldown (CONFIG PIC — 23 Juin 2026) ---
  cooldown_minutes: 15           # défaut (production override → 3 min)
  auto_pause_losses: 5           # défaut (production override → 10)

  # --- Volatilité ---
  max_spread_points: 120         # spread max global (overridden par symbole)

  # --- Circuit breaker (CONFIG PIC — 23 Juin 2026) ---
  circuit_breaker_dd_pct: 0.08   # 8% DD → arrêt d'urgence (production identique)

  # --- Volume max global ---

  # --- Recalibration ---
  recalibration_frequency: 50    # recalib ML tous les 50 trades

