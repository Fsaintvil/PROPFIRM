market_regime:
  adx_trend_enter_default: 22
  adx_trend_exit_default: 18
  hysteresis_offset: 4
  slope_bullish: 0.002
  slope_bearish: -0.002
  vol_high_ratio: 0.015
  vol_low_ratio: 0.003
auto_stop:
  adx_low_threshold: 22
  adx_high_threshold: 18
  ratio_stop: 1.0
  symbols_min_resume: 2
  pause_min_duration: 1800
  adx_snapshot_ttl: 300
  state_ttl: 86400
correlation:
  enabled: true
  max_trades_per_group: 3
  max_trades_per_direction_in_group: 2
  groups:
    FOREX_MAJORS:
      symbols:
      - EURUSD
      - GBPUSD
      - USDCHF
      - USDCAD
      - AUDUSD
      - NZDUSD
      - USDJPY
      description: 7 paires forex majeures corrélées USD
    FOREX_CROSSES:
      symbols:
      - EURJPY
      - GBPJPY
      - EURGBP
      - AUDJPY
      description: 4 paires forex crosses
    CRYPTO:
      symbols:
      - BTCUSD
      - ETHUSD
      - SOLUSD
      - BNBUSD
      description: 5 cryptos (volatilité corrélée)
    INDICES:
      symbols:
      - US500.cash
      - US30.cash
      - US100.cash
      - JP225.cash
      - GER40.cash
      - UK100.cash
      description: 6 indices actions
    COMMODITIES:
      symbols:
      - XAUUSD
      - XAGUSD
      - USOIL.cash
      - UKOIL.cash
      - NATGAS.cash
      description: 5 matières premières
ml:
  experiment_tracking: false
  tracking_uri: ''
  retraining:
    days: 90
    min_samples: 50
    epochs: 10
    n_splits: 5
    schedule_trades: 500
    log_mlflow: false
  concept_drift:
    enabled: false
    window_size: 100
    psi_threshold_light: 0.1
    psi_threshold_moderate: 0.2
    psi_threshold_severe: 0.25
    auto_retrain: false
    retrain_cooldown_hours: 24
news:
  enabled: true
  minutes_before: 5
  minutes_after: 5
  manual_file: config/economic_events.json
secrets:
  mt5_login: ${MT5_LOGIN}
  mt5_password: ${MT5_PASSWORD}
  mt5_server: ${MT5_SERVER}
  telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
  telegram_chat_id: ${TELEGRAM_CHAT_ID}
