robot:
  magic: 999001
  cycle_seconds: 15
  version: "4.1.0"

# ── Trading ──────────────────────────────────────────────────────────────
trading:
  symbols:
    # ═══════════════════════════════════════════════════════════════════════
    # 4 SYMBOLES — 30 Juillet 2026: PROFESSIONAL SOLUTION
    # ═══════════════════════════════════════════════════════════════════════
    # Après analyse du Quant Auditor (30 Juil 2026):
    #   - WR global 44.52% sur 757 trades → stratégie statistiquement perdante
    #   - Seuls USOIL.cash (62.1%) et EURGBP (60.5%) ont un WR positif fiable
    #   - SOLUSD (52.9%) et US30.cash (52.9%) sont borderline
    #   - USOIL.cash: PF 3.66, +$18.25 (challenge) — SEUL VRAI EDGE
    # ═══════════════════════════════════════════════════════════════════════
    - USOIL.cash
    - EURGBP
    - US30.cash
    - SOLUSD

  # 🔧 4 symboles: capacités réduites (30 Juil 2026 — PROFESSIONAL SOLUTION)
  max_positions: 6              # 🔧 30 Juil: ↓ 18→6 (4 symboles × 1.5 positions)
  max_positions_per_symbol: 1   # 🔧 30 Juil: ↓ 2→1 (max 1 par symbole — focus qualité)
  max_trades_per_day: 12        # 🔧 30 Juil: ↓ 50→12 (réduction massive)
  max_signals_per_cycle: 4      # 🔧 30 Juil: ↓ 12→4 (1 par symbole max)
  max_orders_per_minute: 2      # 🔧 30 Juil: ↓ 5→2 (ralentir le rythme)
  lot_size: 0.01                # lot de démarrage minimal
  min_trade_interval_sec: 600   # 🔧 30 Juil: ↑ 300→600 (10 min minimum entre trades)
  batch_interval_sec: 60        # batch toutes les 60s
  trading_start_hour: 0
  trading_end_hour: 24          # 24/7 — sans arrêt
  danger_hours: []              # pas de danger hours (Multi-TF adaptatif)
  history_lookback_days: 7

# ── Signal ───────────────────────────────────────────────────────────────
signal:
  min_score: 0.70               # 🔧 Restauration Juin 2026: ↓ 0.80→0.70 (capture plus de signaux, comme au pic de perf)
  daily_profit_limit_pct: 0.008  # 0.8% profit/jour max (FTMO consistency)

# ── Risque FTMO ─────────────────────────────────────────────────────────
risk:
  # --- Règles FTMO obligatoires ---
  max_daily_loss_pct: 0.02       # 2% daily loss max (règle FTMO)
  max_dd_pct: 0.10               # 10% DD max (règle FTMO)
  profit_target_pct: 0.10        # 10% profit target ($20K sur 200K)
  consistency_max_pct: 0.30      # 30% max un jour / total profit
  min_trading_days: 10           # 10 jours minimum FTMO
  max_trading_days: 0            # pas de limite max

  # --- Risque par trade (PROFESSIONAL SOLUTION — 30 Juillet 2026) ---
  per_trade_pct: 0.002           # 🔧 30 Juil: ↓ 0.008→0.002 (0.20%) — WR 35%, expectancy négative
  short_mult: 1.0                # même risque long/short
  max_risk_amount: 500.0         # 🔧 30 Juil: ↓ $2000→$500 (suit le risk_per_trade réduit)

  # --- Qualité (ultra-conservateur 2 Juillet 2026) ---
  min_rr_ratio: 2.0              # 🔧 Restauration Juin 2026: ↑ 1.8→2.0 (qualité renforcée, comme au pic)
  atr_multiplier: 1.5            # multiplicateur ATR pour SL

  # --- Cooldown (PROFESSIONAL SOLUTION 30 Juillet 2026) ---
  cooldown_minutes: 30          # 🔧 30 Juil: ↑ 15→30min (plus de temps pour analyser après perte)
  auto_pause_losses: 2           # 🔧 30 Juil: ↓ 3→2 (pause dès la 2ème perte consécutive)

  # --- Volatilité ---
  max_spread_points: 120         # spread max global (overridden par symbole)

  # --- Circuit breaker (PROFESSIONAL SOLUTION 30 Juillet 2026) ---
  circuit_breaker_dd_pct: 0.04   # 🔧 30 Juil: ↓ 0.06→0.04 (4% DD → arrêt, marge pour FTMO 10%)

  # --- Volume max global ---
  global_max_lot: 0.05           # 🔧 30 Juil: ↓ 0.10→0.05 — lots plus petits, focus qualité

  # --- Recalibration ---
  recalibration_frequency: 50    # recalib ML tous les 50 trades

