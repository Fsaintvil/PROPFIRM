# ============================================================================
# PRODUCTION OVERRIDES — Synchronisé 2 Juillet 2026 (FIX #5)
# ============================================================================
# Overrides minimaux pour la production.
# Les limites sont gérées par default.yaml + portfolio_controller + signal_pipeline.
# Toutes les valeurs sont synchronisées avec default.yaml (ultra-conservateur).
# ============================================================================

# ── Corrélation — Conservée
correlation:
  enabled: true

# ── Trading — PROFESSIONAL SOLUTION (30 Juillet 2026) — 4 symboles focus
trading:
  max_positions: 6              # 🔧 30 Juil: ↓ 16→6 (ultra-conservateur, WR 35%)
  max_positions_per_symbol: 1   # 🔧 30 Juil: ↓ 2→1 (1 max par symbole)
  max_trades_per_day: 12        # 🔧 30 Juil: ↓ 24→12 (réduction 50%)

# ── Risk — PROFESSIONAL SOLUTION 30 Juillet 2026 ──────────────
risk:
  per_trade_pct: 0.002          # 🔧 30 Juil: ↓ 0.008→0.002 (0.20% — WR 35%, expectancy négative)
  max_daily_loss_pct: 0.02      # FTMO: 2% daily loss
  max_dd_pct: 0.10              # FTMO: 10% max drawdown
  min_rr_ratio: 2.0             # conservé (TP 6.0/SL 1.5 = RR 4.0 naturel)
  cooldown_minutes: 30          # 🔧 30 Juil: ↑ 15→30 (plus de temps entre pertes)
  auto_pause_losses: 2          # 🔧 30 Juil: ↓ 3→2 (pause plus tôt)
  max_risk_amount: 1000.0       # 🔧 30 Juil: ↓ $4000→$1000 (suit per_trade_pct 0.002)
  circuit_breaker_dd_pct: 0.04  # 🔧 30 Juil: ↓ 0.06→0.04 (stop à 4% au lieu de 6%)
  global_max_lot: 0.05          # 🔧 30 Juil: ↓ 0.10→0.05 (lots plus petits)

