# ============================================================================
# PRODUCTION OVERRIDES — Synchronisé 2 Juillet 2026 (FIX #5)
# ============================================================================
# Overrides minimaux pour la production.
# Les limites sont gérées par default.yaml + portfolio_controller + signal_pipeline.
# Toutes les valeurs sont synchronisées avec default.yaml (ultra-conservateur).
# ============================================================================

# ── Corrélation — Conservée
correlation:
  enabled: true

# ── Trading — RÉGLAGE AGRESSIF ÉQUILIBRÉ 04 Aout 2026
# (synchronisé avec default.yaml — retour niveau mi-juin, sous les vetos risk-compliance)
trading:
  max_positions: 6              # gardé au plafond risk-compliance (VETO >8) — débloque 3/direction
  max_positions_per_symbol: 3   # ↑ 2→3 (niveau mi-juin)
  max_trades_per_day: 100       # ↑ 40→100 (niveau mi-juin)
  global_max_lot: 0.20          # ↑ 0.10→0.20 (permet des lots 2× plus gros)

# ── Risk — RÉGLAGE AGRESSIF ÉQUILIBRÉ 04 Aout 2026 ──────────
risk:
  per_trade_pct: 0.005          # conservé (0.50% — risque calibré pour gagner)
  max_daily_loss_pct: 0.02      # FTMO: 2% daily loss (GARDÉ — protection critique)
  max_dd_pct: 0.10              # FTMO: 10% max drawdown (GARDÉ)
  min_rr_ratio: 2.0             # conservé (TP 6.0/SL 1.5 = RR 4.0 naturel)
  cooldown_minutes: 15          # conservé
  auto_pause_losses: 5          # conservé
  max_risk_amount: 250.0         # ⚖️ RÉGLAGE AGRESSIF ÉQUILIBRÉ 04 Aout 2026: $100→$250.
                                 #   Sous le plafond risk-compliance ($300) et le VETO ($400).
                                 #   Les freins restent actifs: degraded mode WR<35%, garde ADX RANGING,
                                 #   perf_mult par symbole, adaptive_lot_mult, daily loss 2%, DD 10%.
  circuit_breaker_dd_pct: 0.06  # conservé (6% — marge pour FTMO 10%)

